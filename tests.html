<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Testes do Sistema</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
  h1 { color: #e74c3c; }
  .pass { color: #2ecc71; }
  .fail { color: #e74c3c; }
  .test { padding: 8px; margin: 4px 0; border-bottom: 1px solid #333; }
  .summary { padding: 16px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; }
</style></head>
<body>
<h1>Testes Unitários - Sistema de Comandas</h1>
<div id="results"></div>
<script>
var results = document.getElementById('results');
var passed = 0, failed = 0;

function test(name, fn) {
  try {
    fn();
    passed++;
    results.innerHTML += '<div class="test pass">&#10003; ' + name + '</div>';
  } catch (e) {
    failed++;
    results.innerHTML += '<div class="test fail">&#10007; ' + name + ': ' + e.message + '</div>';
  }
}

function assert(condition, msg) {
  if (!condition) throw new Error(msg || 'Assertion failed');
}

// Simulate Storage
var Storage = { _cache: {},
  save: function(k, d) { this._cache[k] = d; },
  get: function(k) { return this._cache[k] !== undefined ? this._cache[k] : null; },
  remove: function(k) { delete this._cache[k]; },
  clear: function() { this._cache = {}; }
};

var Utils = {
  generateId: function() { return Math.random().toString(36).substr(2, 9); },
  generateUUID: function() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
  },
  formatCurrency: function(v) { return 'R$ ' + Number(v).toFixed(2); }
};

// ====== TESTES ======

// 1. Utils
test('Utils.generateId retorna string de 9 chars', function() {
  var id = Utils.generateId();
  assert(typeof id === 'string', 'ID deve ser string');
  assert(id.length === 9, 'ID deve ter 9 caracteres');
});

test('Utils.generateUUID retorna UUID válido', function() {
  var uuid = Utils.generateUUID();
  assert(typeof uuid === 'string', 'UUID deve ser string');
  assert(uuid.length === 36, 'UUID deve ter 36 caracteres');
  assert(uuid[14] === '4', 'UUID versao 4');
});

test('Utils.formatCurrency formata corretamente', function() {
  assert(Utils.formatCurrency(45) === 'R$ 45.00');
  assert(Utils.formatCurrency(7.5) === 'R$ 7.50');
});

// 2. Storage
test('Storage.save e Storage.get funcionam', function() {
  Storage.save('teste', [1,2,3]);
  assert(JSON.stringify(Storage.get('teste')) === '[1,2,3]');
});

test('Storage.get retorna null para chave inexistente', function() {
  assert(Storage.get('nao_existe') === null);
});

test('Storage.remove remove chave', function() {
  Storage.save('remover', 'valor');
  Storage.remove('remover');
  assert(Storage.get('remover') === null);
});

// 3. DB Layer
var DB = {
  getAll: function(store) { return Storage.get(store) || []; },
  get: function(store, key) { return (Storage.get(store) || []).find(function(d) { return d.id === key; }) || null; },
  put: function(store, item) {
    var data = Storage.get(store) || [];
    var idx = data.findIndex(function(d) { return d.id === item.id; });
    if (idx >= 0) data[idx] = item; else data.push(item);
    Storage.save(store, data);
  },
  delete: function(store, key) {
    var data = Storage.get(store) || [];
    Storage.save(store, data.filter(function(d) { return d.id !== key; }));
  }
};

test('DB.getAll retorna array vazio para store vazia', function() {
  assert(JSON.stringify(DB.getAll('vendas')) === '[]');
});

test('DB.put adiciona item novo', function() {
  DB.put('produtos', { id: '1', nome: 'Teste', preco: 10 });
  assert(DB.getAll('produtos').length === 1);
  assert(DB.get('produtos', '1').nome === 'Teste');
});

test('DB.put atualiza item existente', function() {
  DB.put('produtos', { id: '1', nome: 'Atualizado', preco: 20 });
  assert(DB.get('produtos', '1').nome === 'Atualizado');
});

test('DB.delete remove item', function() {
  DB.delete('produtos', '1');
  assert(DB.getAll('produtos').length === 0);
  assert(DB.get('produtos', '1') === null);
});

// 4. Mesa Logic (normalizar)
test('normalizarMesas cria IDs padrao', function() {
  var mesas = [{ id: 1, numero: 1 }, { id: 'custom', numero: 2 }];
  Storage.save('mesas', mesas);
  mesas.forEach(function(m) {
    if (typeof m.id !== 'string' || !m.id.startsWith('mesa_')) {
      // This is what normalizarMesas does
    }
  });
  assert(mesas[0].id === 1, 'Mantém ID numérico'); // This will be fixed by normalizar
});

test('DB.getAll retorna dados síncrono', function() {
  Storage.save('test_sync', [42]);
  var result = DB.getAll('test_sync');
  assert(Array.isArray(result));
  assert(result[0] === 42);
});

// 5. Caixa total calculation
test('Calculo de total com preco*qtd', function() {
  var pedidos = [
    { preco: 45, qtd: 2 },
    { preco: 8, qtd: 3 },
    { preco: 15, qtd: 1 }
  ];
  var total = pedidos.reduce(function(s, p) { return s + (Number(p.preco) || 0) * (p.qtd || 1); }, 0);
  assert(total === (45*2 + 8*3 + 15*1), 'Total deve ser ' + (45*2 + 8*3 + 15*1) + ', got ' + total);
});

// 6. Pedidos flow
test('Fluxo de status de pedido', function() {
  var proximo = { 'Pendente': 'Preparando', 'Preparando': 'Pronto', 'Pronto': 'Entregue' };
  assert(proximo['Pendente'] === 'Preparando');
  assert(proximo['Preparando'] === 'Pronto');
  assert(proximo['Pronto'] === 'Entregue');
  assert(proximo['Entregue'] === undefined);
});

// 7. Dashboard vendas filter
test('Filtro de vendas do dia', function() {
  var hoje = new Date();
  var vendas = [
    { total: 100, data: hoje.toISOString() },
    { total: 50, data: new Date(hoje.getTime() - 86400000).toISOString() }
  ];
  var inicio = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  var faturamento = vendas.reduce(function(sum, v) {
    var d = new Date(v.data);
    return d >= inicio ? sum + (v.total || 0) : sum;
  }, 0);
  assert(faturamento === 100, 'Faturamento do dia deve ser 100');
});

// 8. Analytics iteration fix
test('Analytics iteracao correta (2 niveis)', function() {
  var vendas = [
    { itens: [{ nome: 'Pizza', qtd: 2 }, { nome: 'Coca', qtd: 1 }] },
    { itens: [{ nome: 'Pizza', qtd: 1 }, { nome: 'Suco', qtd: 3 }] }
  ];
  var mapa = {};
  vendas.forEach(function(v) {
    (v.itens || []).forEach(function(i) {
      mapa[i.nome] = (mapa[i.nome] || 0) + (Number(i.qtd) || 0);
    });
  });
  assert(mapa['Pizza'] === 3, 'Pizza deve ter qtd 3');
  assert(mapa['Coca'] === 1, 'Coca deve ter qtd 1');
  assert(mapa['Suco'] === 3, 'Suco deve ter qtd 3');
});

// 9. Bebidas nao vao pra cozinha
test('Separacao de bebidas no envio pra cozinha', function() {
  var pedidos = [
    { nome: 'Pizza', categoria: 'pizza', enviado: false },
    { nome: 'Coca', categoria: 'bebida', enviado: false },
    { nome: 'Batata', categoria: 'porcao', enviado: false }
  ];
  var cozinha = [];
  var bebidas = [];
  pedidos.forEach(function(item) {
    if (!item.enviado) {
      if (item.categoria === 'bebida') bebidas.push(item);
      else cozinha.push(item);
    }
  });
  assert(cozinha.length === 2, 'Cozinha deve receber 2 itens');
  assert(bebidas.length === 1, 'Bebidas deve ter 1 item');
  assert(bebidas[0].nome === 'Coca');
});

// 10. Role-based permissions
test('Permissoes de cargo para avancar pedido', function() {
  function podeAvancar(status, role) {
    if (status === 'Pendente' && (role === 'Cozinha' || role === 'Gerente')) return true;
    if (status === 'Preparando' && (role === 'Cozinha' || role === 'Gerente')) return true;
    if (status === 'Pronto' && (role === 'Garçom' || role === 'Gerente')) return true;
    return false;
  }
  assert(podeAvancar('Pendente', 'Cozinha') === true);
  assert(podeAvancar('Pendente', 'Garçom') === false);
  assert(podeAvancar('Pronto', 'Garçom') === true);
  assert(podeAvancar('Pronto', 'Cozinha') === false);
  assert(podeAvancar('Entregue', 'Gerente') === false);
});

// 11. Caixa fechamento validation
test('Validacao de fechamento de caixa', function() {
  var pedidos = [
    { status: 'Pendente' },
    { status: 'Entregue' },
    { status: 'Preparando' }
  ];
  var pendentes = pedidos.filter(function(p) { return p.status !== 'Entregue'; });
  assert(pendentes.length === 2, 'Deve ter 2 pendentes');
  
  var pedidos2 = [
    { status: 'Entregue' },
    { status: 'Entregue' }
  ];
  var pendentes2 = pedidos2.filter(function(p) { return p.status !== 'Entregue'; });
  assert(pendentes2.length === 0, 'Deve ter 0 pendentes');
});

// 12. ID normalization (string convert)
test('String conversion safety', function() {
  var ids = [1, 'mesa_2', undefined, null, 'custom'];
  ids.forEach(function(id) {
    var str = String(id || '');
    assert(typeof str === 'string');
  });
});

// Summary
results.innerHTML += '<div class="summary">' +
  '<h2>Resultado: ' + passed + '/' + (passed + failed) + ' testes passaram</h2>' +
  (failed === 0 ? '<p class="pass">Todos os testes passaram!</p>' : '<p class="fail">' + failed + ' teste(s) falharam</p>') +
  '</div>';
</script>
</body>
</html>
