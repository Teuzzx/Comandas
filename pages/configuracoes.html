<div class="fade-in">
    <header class="dashboard-header">
        <h1 class="dashboard-title">Configurações</h1>
        <p class="dashboard-subtitle">Personalize o sistema de acordo com sua necessidade.</p>
    </header>
    <div class="card config-card">
        <div class="form-group">
            <label>Nome da Empresa</label>
            <input type="text" value="Manus Pizza & Burger">
        </div>
        <div class="form-group">
            <label>CNPJ</label>
            <input type="text" value="00.000.000/0001-00">
        </div>
        <div class="form-group">
            <label>Taxa de Serviço (%)</label>
            <input type="number" value="10">
        </div>
        <button class="btn-primary" style="width: 100%; margin-top: 20px;">Salvar Alterações</button>
    </div>
    <div class="card config-card" style="margin-top:20px;">
        <div class="section-title">Backup & Restaurar</div>
        <p>Faça backup completo do banco de dados local ou importe um arquivo JSON para restaurar.</p>
        <div class="field-row" style="margin-top:10px;">
            <button class="btn-primary" id="exportDbBtn">Exportar Backup (JSON)</button>
            <label class="btn" style="background:#2d2d2d; color:var(--text-main); padding:10px 12px; border-radius:8px;">
                Importar Backup
                <input type="file" id="importDbFile" accept="application/json" style="display:none;">
            </label>
        </div>

        <hr style="margin: 16px 0; border-color: var(--glass-border);">
        <div class="section-title">Usuários & Permissões</div>
        <div id="usersList" style="margin-top:8px;"></div>
        <hr style="margin:12px 0; border-color:var(--glass-border);">
        <div class="section-title">Logs de Auditoria</div>
        <div class="field-row" style="margin-top:8px; align-items:center;">
            <button class="btn" id="btnShowAudits">Ver Logs</button>
            <button class="btn" id="btnExportAudits">Exportar Logs (JSON)</button>
            <button class="btn" id="btnClearAudits">Limpar Logs</button>
        </div>
        <div id="auditLogs" style="margin-top:12px; max-height:300px; overflow:auto; border-top:1px solid var(--glass-border); padding-top:8px;"></div>
        <div class="field-row" style="margin-top:12px; align-items:center;">
            <input id="newUserName" placeholder="Nome completo" style="flex:1;">
            <input id="newUsername" placeholder="username" style="width:160px;">
            <input id="newUserPass" placeholder="senha" type="password" style="width:140px;">
            <select id="newUserRole">
                <option value="Gerente">Gerente</option>
                <option value="Garçom">Garçom</option>
                <option value="Cozinha">Cozinha</option>
            </select>
            <button class="btn-primary" id="addUserBtn">Adicionar</button>
        </div>
    </div>
</div>
