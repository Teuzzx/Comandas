<div class="fade-in">
    <header class="dashboard-header">
        <h1 class="dashboard-title">Caixa</h1>
        <p class="dashboard-subtitle">Fechamento de contas e recebimentos.</p>
    </header>

    <div class="caixa-container">
        <div class="caixa-list" id="caixaList">
            <!-- Mesas aguardando pagamento -->
        </div>

        <div class="card checkout-card glass" id="checkoutArea" style="display: none;">
            <h3 style="margin-bottom: 20px;">Resumo do Pagamento</h3>
            <div id="checkoutDetails">
                <!-- Detalhes da mesa selecionada -->
            </div>

            <div class="payment-methods">
                <button class="payment-btn active" onclick="Caixa.setPayment('pix')">
                    <i class="fas fa-qrcode"></i> PIX
                </button>
                <button class="payment-btn" onclick="Caixa.setPayment('dinheiro')">
                    <i class="fas fa-money-bill-wave"></i> Dinheiro
                </button>
                <button class="payment-btn" onclick="Caixa.setPayment('cartao')">
                    <i class="fas fa-credit-card"></i> Cartão
                </button>
                <button class="payment-btn" onclick="Caixa.setPayment('debito')">
                    <i class="fas fa-credit-card"></i> Débito
                </button>
            </div>

            <div class="form-group">
                <label>Desconto (R$)</label>
                <input type="number" id="inputDesconto" value="0" oninput="Caixa.calculateTotal()">
            </div>

            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border);">
                <div class="flex-between" style="margin-bottom: 10px;">
                    <span>Subtotal:</span>
                    <span id="checkoutSubtotal">R$ 0,00</span>
                </div>
                <div class="flex-between" style="margin-bottom: 20px; font-size: 1.3rem; font-weight: 800;">
                    <span>Total:</span>
                    <span id="checkoutTotal" style="color: var(--success);">R$ 0,00</span>
                </div>
                <button class="btn-primary" style="width: 100%; padding: 15px; background: var(--success);" onclick="Caixa.finalizarVenda()">Finalizar e Imprimir</button>
            </div>
        </div>
    </div>
</div>
